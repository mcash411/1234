<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7-ELEVEN POS 條碼、繳費單與兌換券系統 (動態萬能輸入框與一維條碼)</title>
    
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="7-11 POS">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- html5-qrcode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.4/html5-qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-seven-stripe {
            background: linear-gradient(135deg, #e11d48 0%, #e11d48 33%, #ea580c 33%, #ea580c 66%, #059669 66%, #059669 100%);
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .print-container { box-shadow: none !important; border: none !important; }
            .batch-item { break-inside: avoid; page-break-inside: avoid; border: 1px solid #cbd5e1 !important; margin-bottom: 15px; }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-20 select-none">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 no-print shadow-xs">
        <div class="h-1.5 bg-seven-stripe w-full"></div>
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-slate-900 text-white rounded-xl flex items-center justify-center font-black text-xl tracking-tighter shadow-sm border border-slate-800">
                    7<span class="text-xs text-emerald-400">11</span>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg leading-tight text-slate-900">7-ELEVEN POS Web App</h1>
                    <p class="text-[11px] text-slate-500">一維條碼顯示 / 動態萬能輸入框 / QR Code 與批量儲存</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openSavedModal()" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-xl font-bold transition flex items-center space-x-1.5 shadow-xs">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span>已儲存條碼 (<span id="savedCountBadge">0</span>)</span>
                </button>
                <button onclick="window.print()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-medium transition flex items-center space-x-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    <span class="hidden sm:inline">列印 / 存PDF</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-container">
            
            <div class="bg-slate-900 text-white px-5 py-4 flex items-center justify-between no-print">
                <div class="flex items-center space-x-2.5">
                    <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="font-bold text-sm tracking-wide">POS 條碼模式切換</span>
                </div>
                <div class="flex items-center space-x-2 bg-slate-800 p-1 rounded-xl border border-slate-700">
                    <button onclick="switchMode('single')" id="modeSingleBtn" class="px-3 py-1 text-xs font-bold rounded-lg transition bg-emerald-600 text-white">單筆即時模式</button>
                    <button onclick="switchMode('batch')" id="modeBatchBtn" class="px-3 py-1 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">批量生成模式</button>
                </div>
            </div>

            <!-- 單筆模式介面 -->
            <div id="singleModeSection" class="p-5 space-y-6">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200/80 space-y-3.5 no-print">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-700 border-b border-slate-200 pb-2">
                        <span class="flex items-center space-x-1.5">
                            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                            <span>智慧條碼自動辨識與相機連續掃描</span>
                        </span>
                        <div class="flex items-center space-x-2">
                            <button onclick="toggleScanner()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 shadow-xs">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span id="scannerBtnText">開啟相機連續掃描</span>
                            </button>
                            <button onclick="fillSampleData()" class="text-xs text-emerald-600 hover:text-emerald-700 font-semibold underline active:opacity-75">預設範例</button>
                        </div>
                    </div>

                    <div id="scannerContainer" class="hidden bg-slate-900 p-3 rounded-xl border border-slate-700 text-center relative">
                        <div id="reader" class="w-full max-w-md mx-auto overflow-hidden rounded-lg"></div>
                        <div id="scanFeedback" class="mt-2 text-xs font-bold text-emerald-400 h-5"></div>
                        <button onclick="toggleScanner()" class="mt-2 text-xs bg-rose-600 hover:bg-rose-700 text-white px-4 py-1.5 rounded-lg font-bold transition">關閉相機</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                        <div class="sm:col-span-8">
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">單號類型 (Type)</label>
                            <select id="selectType" onchange="changeType(this.value)"
                                class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                                <option value="goods" selected>商品 (Goods - 1組)</option>
                                <option value="utility">繳費單 (Utility - 3組)</option>
                                <option value="egtc">電子兌換券 (EGTC - 2組)</option>
                            </select>
                        </div>
                        <div class="sm:col-span-4" id="formatSelectWrapper">
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">一維條碼格式</label>
                            <select id="selectBarcodeFormat" onchange="setBarcodeFormat(this.value)"
                                class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-lg text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                                <option value="EAN8" selected>EAN-8</option>
                                <option value="EAN13">EAN-13</option>
                                <option value="CODE128">CODE128</option>
                                <option value="CODE39">CODE39</option>
                            </select>
                        </div>

                        <!-- 動態萬能輸入框區域 -->
                        <div class="sm:col-span-12 space-y-2 pt-2 border-t border-slate-200/60" id="dynamicInputsContainer">
                            <!-- 程式動態生成欄位 -->
                        </div>

                        <div class="hidden">
                            <input type="text" id="inputUniversal" value="20719128">
                            <input type="text" id="inputCode1">
                            <input type="text" id="inputCode2">
                            <input type="text" id="inputCode3">
                            <input type="text" id="inputEgtcBarcode1">
                            <input type="text" id="inputEgtcBarcode2">
                        </div>
                    </div>
                </div>

                <!-- 條碼與 QR Code 顯示區 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border border-slate-100 rounded-xl p-4 bg-white">
                    <div class="w-full text-center border-b md:border-b-0 md:border-r border-slate-100 pb-5 md:pb-0 md:pr-5 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between text-xs text-slate-500 font-medium mb-3">
                                <span class="flex items-center space-x-1.5">
                                    <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                                    <span class="font-bold text-slate-700">1D Barcode (一維條碼)</span>
                                </span>
                                <span class="text-[10px] bg-orange-50 text-orange-700 px-2 py-0.5 rounded-md font-bold border border-orange-200" id="formatLabel">EAN8</span>
                            </div>
                            
                            <div class="bg-slate-50/50 p-4 rounded-xl border border-slate-100 flex flex-col items-center justify-center min-h-[160px] space-y-4">
                                <div id="singleBarcodeWrapper" class="w-full flex flex-col items-center">
                                    <svg id="barcode1D" class="max-w-full"></svg>
                                </div>

                                <div id="utilityBarcodesWrapper" class="w-full flex flex-col items-center space-y-3 hidden">
                                    <div class="w-full flex flex-col items-center">
                                        <span class="text-[10px] text-slate-400 mb-0.5">Code 1</span>
                                        <svg id="barcodeCode1" class="max-w-full"></svg>
                                    </div>
                                    <div class="w-full flex flex-col items-center">
                                        <span class="text-[10px] text-slate-400 mb-0.5">Code 2</span>
                                        <svg id="barcodeCode2" class="max-w-full"></svg>
                                    </div>
                                    <div id="wrapperCode3" class="w-full flex flex-col items-center">
                                        <span class="text-[10px] text-slate-400 mb-0.5">Code 3</span>
                                        <svg id="barcodeCode3" class="max-w-full"></svg>
                                    </div>
                                </div>

                                <div id="egtcBarcodesWrapper" class="w-full flex flex-col items-center space-y-3 hidden">
                                    <div class="w-full flex flex-col items-center">
                                        <span class="text-[10px] text-slate-400 mb-0.5">Barcode 1 (兌換券號)</span>
                                        <svg id="barcodeEgtc1" class="max-w-full"></svg>
                                    </div>
                                    <div class="w-full flex flex-col items-center">
                                        <span class="text-[10px] text-slate-400 mb-0.5">Barcode 2 (驗證碼)</span>
                                        <svg id="barcodeEgtc2" class="max-w-full"></svg>
                                    </div>
                                </div>

                                <div id="barcodeErrorMsg" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-lg w-full text-center font-medium">
                                    條碼格式或長度錯誤
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-center no-print">
                            <button onclick="saveCurrentBarcode()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2 shadow-xs">
                                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                                <span>儲存此筆條碼到我的清單</span>
                            </button>
                        </div>
                    </div>

                    <div class="w-full text-center flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between text-xs text-slate-500 font-medium mb-3">
                                <span class="flex items-center space-x-1.5">
                                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                                    <span class="font-bold text-slate-700">QR Code (二維條碼)</span>
                                </span>
                                <span class="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md font-bold border border-blue-200">Auto Generate</span>
                            </div>

                            <div class="bg-slate-50/50 p-4 rounded-xl border border-slate-100 flex flex-col items-center justify-center min-h-[160px]">
                                <div id="qrcode" class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs inline-block"></div>
                                <p id="qrDataText" class="text-[11px] font-mono text-slate-500 mt-3 break-all max-w-xs"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 批量模式介面 -->
            <div id="batchModeSection" class="p-5 space-y-6 hidden">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200/80 space-y-3.5 no-print">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center text-xs font-bold text-slate-700 border-b border-slate-200 pb-2 gap-2">
                        <span class="flex items-center space-x-1.5">
                            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                            <span>批量條碼輸入與相機連續掃描</span>
                        </span>
                        <div class="flex items-center flex-wrap gap-2">
                            <button onclick="toggleBatchScanner()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 shadow-xs">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span id="batchScannerBtnText">開啟相機連續掃描加入</span>
                            </button>
                            <button onclick="fillBatchSample()" class="text-xs text-emerald-600 hover:text-emerald-700 font-semibold underline">載入批量範例</button>
                        </div>
                    </div>

                    <div id="batchScannerContainer" class="hidden bg-slate-900 p-3 rounded-xl border border-slate-700 text-center relative">
                        <div id="batchReader" class="w-full max-w-md mx-auto overflow-hidden rounded-lg"></div>
                        <div id="batchScanFeedback" class="mt-2 text-xs font-bold text-emerald-400 h-5"></div>
                        <button onclick="toggleBatchScanner()" class="mt-2 text-xs bg-rose-600 hover:bg-rose-700 text-white px-4 py-1.5 rounded-lg font-bold transition">關閉相機</button>
                    </div>

                    <!-- 批量新增條碼、數量與獨立備註工具列 -->
                    <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 space-y-2.5 shadow-2xs">
                        <span class="text-[11px] font-bold text-slate-600 flex items-center space-x-1">
                            <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            <span>快速新增單筆條碼、數量與備註至下方</span>
                        </span>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                            <div class="sm:col-span-5">
                                <input type="text" id="quickBatchCode" placeholder="條碼代碼 (例如 20719128)" 
                                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                            </div>
                            <div class="sm:col-span-4">
                                <input type="text" id="quickBatchNote" placeholder="備註說明 (例如 鮮乳)" 
                                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                            </div>
                            <div class="sm:col-span-3 flex items-center space-x-2">
                                <div class="flex items-center space-x-1.5 bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 flex-1">
                                    <span class="text-[11px] text-slate-500 font-bold whitespace-nowrap">數量</span>
                                    <input type="number" id="quickBatchQty" value="1" min="1" max="99" 
                                        class="w-10 text-center text-xs font-bold text-slate-800 outline-none bg-transparent">
                                </div>
                                <button onclick="appendQuickBatchItem()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center justify-center space-x-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                    <span>加入</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 下方文字輸入框 (支援 條碼, 數量, 備註 格式) -->
                    <div class="space-y-1">
                        <div class="flex justify-between items-center px-1">
                            <span class="text-[11px] font-bold text-slate-600">批量清單編輯區 (格式：條碼, 數量, 備註)</span>
                            <span class="text-[10px] text-slate-400">支援手動輸入與多行貼上</span>
                        </div>
                        <textarea id="batchTextArea" rows="6" placeholder="例如：&#10;20719128, 2, 鮮乳特價&#10;131201788 9524294830000049, 1, 水電費帳單" 
                            class="w-full px-3.5 py-3 bg-white border border-slate-300 rounded-xl text-xs font-mono text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs leading-relaxed"></textarea>
                    </div>
                    
                    <!-- 批量設定工具列：一維格式選擇與 QR Code 顯示切換 -->
                    <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-3 rounded-xl border border-slate-200 gap-3">
                        <div class="flex items-center space-x-2 w-full sm:w-auto">
                            <label class="text-[11px] font-bold text-slate-600 whitespace-nowrap">一維條碼格式：</label>
                            <select id="batchFormatSelect" onchange="generateBatchBarcodes()"
                                class="px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                                <option value="AUTO" selected>自動智慧判斷 (Auto)</option>
                                <option value="EAN8">EAN-8</option>
                                <option value="EAN13">EAN-13</option>
                                <option value="CODE128">CODE128</option>
                                <option value="CODE39">CODE39</option>
                            </select>
                        </div>

                        <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                            <label class="flex items-center space-x-1.5 px-2.5 py-1 text-[11px] cursor-pointer">
                                <input type="checkbox" id="batchShowQrToggle" onchange="generateBatchBarcodes()" class="rounded text-emerald-600 focus:ring-emerald-500 w-3.5 h-3.5">
                                <span class="text-slate-700 font-semibold">顯示二維條碼 (QR Code)</span>
                            </label>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-2 pt-1">
                        <button onclick="saveBatchBarcodes()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-xs flex items-center space-x-1.5">
                            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            <span>儲存所有批量條碼</span>
                        </button>
                        <button onclick="generateBatchBarcodes()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow-xs">
                            立即批量生成
                        </button>
                    </div>
                </div>

                <div id="batchResultsContainer" class="space-y-4">
                    <!-- 批量生成結果顯示處 -->
                </div>
            </div>

        </section>
    </main>

    <!-- 已儲存條碼管理 Modal -->
    <div id="savedModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden border border-slate-200">
            <div class="bg-slate-900 text-white px-5 py-4 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span class="font-bold text-sm">已儲存的條碼清單</span>
                </div>
                <button onclick="closeSavedModal()" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto space-y-4 flex-1 bg-slate-50" id="savedListContainer">
                <!-- 儲存列表 -->
            </div>

            <div class="bg-white border-t border-slate-200 px-5 py-3 flex justify-between items-center">
                <button onclick="clearSavedBarcodes()" class="text-xs text-rose-600 hover:text-rose-700 font-bold px-3 py-1.5 rounded-lg hover:bg-rose-50 transition">
                    清空所有儲存
                </button>
                <button onclick="closeSavedModal()" class="bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl">
                    關閉視窗
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'single';
        let currentBarcodeFormat = 'EAN8';
        let html5QrCode = null;
        let isScannerRunning = false;
        let batchHtml5QrCode = null;
        let isBatchScannerRunning = false;
        let savedBarcodes = JSON.parse(localStorage.getItem('seven_pos_saved') || '[]');

        window.addEventListener('DOMContentLoaded', () => {
            initDynamicInputs('goods');
            updateSavedCount();
            document.getElementById('batchTextArea').value = "20719128, 2, 鮮乳特價\n131201788 9524294830000049, 1, 水電費帳單";
            generateSingleBarcodes();
        });

        function switchMode(mode) {
            currentMode = mode;
            if(isScannerRunning) toggleScanner();
            if(isBatchScannerRunning) toggleBatchScanner();

            const singleSec = document.getElementById('singleModeSection');
            const batchSec = document.getElementById('batchModeSection');
            const btnSingle = document.getElementById('modeSingleBtn');
            const btnBatch = document.getElementById('modeBatchBtn');

            if(mode === 'single') {
                singleSec.classList.remove('hidden');
                batchSec.classList.add('hidden');
                btnSingle.className = "px-3 py-1 text-xs font-bold rounded-lg transition bg-emerald-600 text-white";
                btnBatch.className = "px-3 py-1 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white";
                generateSingleBarcodes();
            } else {
                singleSec.classList.add('hidden');
                batchSec.classList.remove('hidden');
                btnBatch.className = "px-3 py-1 text-xs font-bold rounded-lg transition bg-emerald-600 text-white";
                btnSingle.className = "px-3 py-1 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white";
                generateBatchBarcodes();
            }
        }

        function changeType(type) {
            initDynamicInputs(type);
            const formatWrapper = document.getElementById('formatSelectWrapper');
            if(type === 'goods') {
                formatWrapper.classList.remove('hidden');
            } else {
                formatWrapper.classList.add('hidden');
            }
            generateSingleBarcodes();
        }

        function setBarcodeFormat(fmt) {
            currentBarcodeFormat = fmt;
            document.getElementById('formatLabel').innerText = fmt;
            generateSingleBarcodes();
        }

        function initDynamicInputs(type) {
            const container = document.getElementById('dynamicInputsContainer');
            container.innerHTML = '';

            if(type === 'goods') {
                container.innerHTML = `
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">商品條碼內容與數量</label>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="uniField0" oninput="syncInputs()" value="20719128" placeholder="請輸入條碼代碼"
                            class="flex-1 px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                        <div class="flex items-center space-x-1.5 bg-white border border-slate-300 rounded-xl px-2.5 py-2">
                            <span class="text-[11px] text-slate-500 font-bold">數量</span>
                            <input type="number" id="uniQty0" value="1" min="1" max="99" onchange="generateSingleBarcodes()"
                                class="w-10 text-center text-xs font-bold text-slate-800 outline-none bg-transparent">
                        </div>
                    </div>
                `;
            } else if(type === 'utility') {
                container.innerHTML = `
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">繳費單三段式條碼與數量</label>
                    <div class="space-y-2">
                        <div class="flex items-center space-x-2">
                            <input type="text" id="uniField0" oninput="syncInputs()" value="131201788" placeholder="第一段條碼 (通常9碼)"
                                class="flex-1 px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="text" id="uniField1" oninput="syncInputs()" value="9524294830000049" placeholder="第二段條碼 (通常16碼)"
                                class="flex-1 px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="text" id="uniField2" oninput="syncInputs()" value="12345678" placeholder="第三段條碼 (通常15碼內)"
                                class="flex-1 px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                            <div class="flex items-center space-x-1.5 bg-white border border-slate-300 rounded-xl px-2.5 py-2">
                                <span class="text-[11px] text-slate-500 font-bold">數量</span>
                                <input type="number" id="uniQty0" value="1" min="1" max="99" onchange="generateSingleBarcodes()"
                                    class="w-10 text-center text-xs font-bold text-slate-800 outline-none bg-transparent">
                            </div>
                        </div>
                    </div>
                `;
            } else if(type === 'egtc') {
                container.innerHTML = `
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">電子兌換券兩組條碼與數量</label>
                    <div class="space-y-2">
                        <div class="flex items-center space-x-2">
                            <input type="text" id="uniField0" oninput="syncInputs()" value="123456789012" placeholder="第一組 兌換券號"
                                class="flex-1 px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="text" id="uniField1" oninput="syncInputs()" value="987654321098" placeholder="第二組 驗證密碼"
                                class="flex-1 px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-mono font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 outline-none shadow-xs">
                            <div class="flex items-center space-x-1.5 bg-white border border-slate-300 rounded-xl px-2.5 py-2">
                                <span class="text-[11px] text-slate-500 font-bold">數量</span>
                                <input type="number" id="uniQty0" value="1" min="1" max="99" onchange="generateSingleBarcodes()"
                                    class="w-10 text-center text-xs font-bold text-slate-800 outline-none bg-transparent">
                            </div>
                        </div>
                    </div>
                `;
            }
            syncInputs();
        }

        function syncInputs() {
            const type = document.getElementById('selectType').value;
            const f0 = document.getElementById('uniField0')?.value || '';
            const f1 = document.getElementById('uniField1')?.value || '';
            const f2 = document.getElementById('uniField2')?.value || '';

            if(type === 'goods') {
                document.getElementById('inputUniversal').value = f0;
            } else if(type === 'utility') {
                document.getElementById('inputCode1').value = f0;
                document.getElementById('inputCode2').value = f1;
                document.getElementById('inputCode3').value = f2;
            } else if(type === 'egtc') {
                document.getElementById('inputEgtcBarcode1').value = f0;
                document.getElementById('inputEgtcBarcode2').value = f1;
            }
            generateSingleBarcodes();
        }

        function fillSampleData() {
            const type = document.getElementById('selectType').value;
            if(type === 'goods') {
                document.getElementById('uniField0').value = "ABC-12345";
                setBarcodeFormat('CODE39');
                document.getElementById('selectBarcodeFormat').value = 'CODE39';
            } else if(type === 'utility') {
                document.getElementById('uniField0').value = "131201788";
                document.getElementById('uniField1').value = "9524294830000049";
                document.getElementById('uniField2').value = "88888";
            } else if(type === 'egtc') {
                document.getElementById('uniField0').value = "998877665544";
                document.getElementById('uniField1').value = "112233445566";
            }
            syncInputs();
        }

        function generateSingleBarcodes() {
            const type = document.getElementById('selectType').value;
            const errorMsg = document.getElementById('barcodeErrorMsg');
            errorMsg.classList.add('hidden');

            const singleWrapper = document.getElementById('singleBarcodeWrapper');
            const utilityWrapper = document.getElementById('utilityBarcodesWrapper');
            const egtcWrapper = document.getElementById('egtcBarcodesWrapper');

            singleWrapper.classList.add('hidden');
            utilityWrapper.classList.add('hidden');
            egtcWrapper.classList.add('hidden');

            let qrTextVal = "";

            try {
                if(type === 'goods') {
                    singleWrapper.classList.remove('hidden');
                    const val = document.getElementById('inputUniversal').value.trim() || "00000000";
                    qrTextVal = val;
                    JsBarcode("#barcode1D", val, {
                        format: currentBarcodeFormat,
                        lineColor: "#0f172a",
                        width: 2,
                        height: 70,
                        displayValue: true,
                        fontSize: 14,
                        margin: 5
                    });
                } else if(type === 'utility') {
                    utilityWrapper.classList.remove('hidden');
                    const c1 = document.getElementById('inputCode1').value.trim() || "000000000";
                    const c2 = document.getElementById('inputCode2').value.trim() || "0000000000000000";
                    const c3 = document.getElementById('inputCode3').value.trim() || "0000000";
                    qrTextVal = `${c1}\n${c2}\n${c3}`;

                    JsBarcode("#barcodeCode1", c1, { format: "CODE128", lineColor: "#0f172a", width: 1.8, height: 45, displayValue: true, fontSize: 12, margin: 2 });
                    JsBarcode("#barcodeCode2", c2, { format: "CODE128", lineColor: "#0f172a", width: 1.5, height: 45, displayValue: true, fontSize: 12, margin: 2 });
                    
                    const wrapperC3 = document.getElementById('wrapperCode3');
                    if(c3) {
                        wrapperC3.classList.remove('hidden');
                        JsBarcode("#barcodeCode3", c3, { format: "CODE128", lineColor: "#0f172a", width: 1.8, height: 45, displayValue: true, fontSize: 12, margin: 2 });
                    } else {
                        wrapperC3.classList.add('hidden');
                    }
                } else if(type === 'egtc') {
                    egtcWrapper.classList.remove('hidden');
                    const e1 = document.getElementById('inputEgtcBarcode1').value.trim() || "000000000000";
                    const e2 = document.getElementById('inputEgtcBarcode2').value.trim() || "000000000000";
                    qrTextVal = `${e1} | ${e2}`;

                    JsBarcode("#barcodeEgtc1", e1, { format: "CODE128", lineColor: "#0f172a", width: 1.8, height: 50, displayValue: true, fontSize: 12, margin: 3 });
                    JsBarcode("#barcodeEgtc2", e2, { format: "CODE128", lineColor: "#0f172a", width: 1.8, height: 50, displayValue: true, fontSize: 12, margin: 3 });
                }

                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById('qrcode'), {
                    text: qrTextVal || "7-11 POS",
                    width: 130,
                    height: 130,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });
                document.getElementById('qrDataText').innerText = qrTextVal;

            } catch (e) {
                errorMsg.classList.remove('hidden');
                console.error(e);
            }
        }

        function toggleScanner() {
            const container = document.getElementById('scannerContainer');
            const btnText = document.getElementById('scannerBtnText');

            if(isScannerRunning) {
                if(html5QrCode) {
                    html5QrCode.stop().then(() => {
                        container.classList.add('hidden');
                        btnText.innerText = "開啟相機連續掃描";
                        isScannerRunning = false;
                    }).catch(err => console.error(err));
                }
            } else {
                container.classList.remove('hidden');
                btnText.innerText = "關閉相機";
                isScannerRunning = true;

                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 150 } };
                html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                    document.getElementById('scanFeedback').innerText = `成功掃描: ${decodedText}`;
                    autoFillScannedText(decodedText);
                    setTimeout(() => { document.getElementById('scanFeedback').innerText = ""; }, 3000);
                }, (errorMessage) => {}).catch(err => {
                    alert("無法啟動相機權限：" + err);
                    container.classList.add('hidden');
                    isScannerRunning = false;
                });
            }
        }

        function autoFillScannedText(text) {
            const type = document.getElementById('selectType').value;
            if(type === 'goods') {
                document.getElementById('uniField0').value = text;
            } else if(type === 'utility') {
                const f0 = document.getElementById('uniField0');
                const f1 = document.getElementById('uniField1');
                const f2 = document.getElementById('uniField2');
                if(!f0.value) f0.value = text;
                else if(!f1.value) f1.value = text;
                else f2.value = text;
            } else if(type === 'egtc') {
                const f0 = document.getElementById('uniField0');
                const f1 = document.getElementById('uniField1');
                if(!f0.value) f0.value = text;
                else f1.value = text;
            }
            syncInputs();
        }

        function toggleBatchScanner() {
            const container = document.getElementById('batchScannerContainer');
            const btnText = document.getElementById('batchScannerBtnText');

            if(isBatchScannerRunning) {
                if(batchHtml5QrCode) {
                    batchHtml5QrCode.stop().then(() => {
                        container.classList.add('hidden');
                        btnText.innerText = "開啟相機連續掃描加入";
                        isBatchScannerRunning = false;
                    }).catch(err => console.error(err));
                }
            } else {
                container.classList.remove('hidden');
                btnText.innerText = "關閉相機";
                isBatchScannerRunning = true;

                batchHtml5QrCode = new Html5Qrcode("batchReader");
                const config = { fps: 10, qrbox: { width: 250, height: 150 } };
                batchHtml5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                    document.getElementById('batchScanFeedback').innerText = `已加入: ${decodedText}`;
                    const ta = document.getElementById('batchTextArea');
                    ta.value += (ta.value ? "\n" : "") + `${decodedText}, 1, 掃描條碼`;
                    generateBatchBarcodes();
                    setTimeout(() => { document.getElementById('batchScanFeedback').innerText = ""; }, 2000);
                }, (errorMessage) => {}).catch(err => {
                    alert("無法啟動相機權限：" + err);
                    container.classList.add('hidden');
                    isBatchScannerRunning = false;
                });
            }
        }

        function appendQuickBatchItem() {
            const codeInput = document.getElementById('quickBatchCode');
            const noteInput = document.getElementById('quickBatchNote');
            const qtyInput = document.getElementById('quickBatchQty');
            const codeVal = codeInput.value.trim();
            const noteVal = noteInput.value.trim();
            const qtyVal = parseInt(qtyInput.value) || 1;

            if(!codeVal) {
                alert("請輸入條碼內容！");
                codeInput.focus();
                return;
            }

            const ta = document.getElementById('batchTextArea');
            let newLine = `${codeVal}, ${qtyVal}`;
            if(noteVal) {
                newLine += `, ${noteVal}`;
            }
            ta.value += (ta.value.trim() ? "\n" : "") + newLine;
            
            codeInput.value = "";
            noteInput.value = "";
            qtyInput.value = "1";
            codeInput.focus();
            generateBatchBarcodes();
        }

        function fillBatchSample() {
            document.getElementById('batchTextArea').value = "20719128, 2, 鮮乳特價\nABC-12345, 1, 倉庫貨號(Code39)\n131201788 9524294830000049, 1, 水電費帳單";
            generateBatchBarcodes();
        }

        function generateBatchBarcodes() {
            const text = document.getElementById('batchTextArea').value;
            const container = document.getElementById('batchResultsContainer');
            const showQr = document.getElementById('batchShowQrToggle').checked;
            const selectedFormat = document.getElementById('batchFormatSelect').value;
            container.innerHTML = '';

            const lines = text.split('\n').filter(l => l.trim() !== '');
            if(lines.length === 0) {
                container.innerHTML = '<div class="text-center text-xs text-slate-400 py-6">目前尚無批量條碼資料</div>';
                return;
            }

            lines.forEach((line, index) => {
                let parts = line.split(',');
                let codePart = parts[0].trim();
                let qtyPart = parts[1] ? parseInt(parts[1].trim()) || 1 : 1;
                let notePart = parts[2] ? parts[2].trim() : '';

                let itemDiv = document.createElement('div');
                itemDiv.className = "batch-item bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row items-center justify-between gap-4";

                let barcodeSvgId = `batch_bc_${index}`;
                let qrDivId = `batch_qr_${index}`;

                itemDiv.innerHTML = `
                    <div class="flex-1 w-full text-center md:text-left">
                        <div class="flex flex-wrap items-center justify-between mb-2 gap-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-bold text-slate-500">項目 #${index + 1}</span>
                                ${notePart ? `<span class="text-xs font-bold bg-emerald-50 text-emerald-700 px-2.5 py-0.5 rounded-md border border-emerald-200">${notePart}</span>` : ''}
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-500">數量: <span class="text-emerald-600 font-bold">${qtyPart}</span></span>
                                <span class="text-[10px] font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${codePart}</span>
                            </div>
                        </div>
                        <div class="flex justify-center md:justify-start overflow-x-auto py-1">
                            <svg id="${barcodeSvgId}"></svg>
                        </div>
                    </div>
                    ${showQr ? `<div class="flex flex-col items-center justify-center border-t md:border-t-0 md:border-l border-slate-100 pt-3 md:pt-0 md:pl-4"><div id="${qrDivId}" class="bg-white p-1.5 rounded border border-slate-200"></div><span class="text-[9px] text-slate-400 mt-1">QR Code</span></div>` : ''}
                `;
                container.appendChild(itemDiv);

                try {
                    let fmt = selectedFormat;
                    if (fmt === 'AUTO') {
                        fmt = codePart.length === 13 ? "EAN13" : (codePart.length === 8 ? "EAN8" : "CODE128");
                    }

                    JsBarcode(`#${barcodeSvgId}`, codePart, {
                        format: fmt,
                        lineColor: "#0f172a",
                        width: 1.8,
                        height: 55,
                        displayValue: true,
                        fontSize: 12,
                        margin: 2
                    });

                    if(showQr) {
                        new QRCode(document.getElementById(qrDivId), {
                            text: codePart,
                            width: 80,
                            height: 80,
                            colorDark : "#0f172a",
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.M
                        });
                    }
                } catch(e) {
                    console.error("Batch barcode error:", e);
                }
            });
        }

        function saveBatchBarcodes() {
            const text = document.getElementById('batchTextArea').value;
            const lines = text.split('\n').filter(l => l.trim() !== '');
            if(lines.length === 0) {
                alert("沒有可儲存的批量條碼內容！");
                return;
            }

            lines.forEach(line => {
                let parts = line.split(',');
                let codePart = parts[0].trim();
                let qtyPart = parts[1] ? parseInt(parts[1].trim()) || 1 : 1;
                let notePart = parts[2] ? parts[2].trim() : '批量條碼';

                savedBarcodes.push({
                    type: 'batch',
                    code: codePart,
                    qty: qtyPart,
                    note: notePart,
                    time: new Date().toLocaleString()
                });
            });

            localStorage.setItem('seven_pos_saved', JSON.stringify(savedBarcodes));
            updateSavedCount();
            alert(`成功儲存 ${lines.length} 筆條碼至我的清單！`);
        }

        function saveCurrentBarcode() {
            const type = document.getElementById('selectType').value;
            let codeVal = "";
            let qty = 1;

            if(type === 'goods') {
                codeVal = document.getElementById('inputUniversal').value;
                qty = parseInt(document.getElementById('uniQty0')?.value || 1);
            } else if(type === 'utility') {
                const c1 = document.getElementById('inputCode1').value;
                const c2 = document.getElementById('inputCode2').value;
                const c3 = document.getElementById('inputCode3').value;
                codeVal = `${c1} / ${c2} / ${c3}`;
                qty = parseInt(document.getElementById('uniQty0')?.value || 1);
            } else if(type === 'egtc') {
                const e1 = document.getElementById('inputEgtcBarcode1').value;
                const e2 = document.getElementById('inputEgtcBarcode2').value;
                codeVal = `${e1} & ${e2}`;
                qty = parseInt(document.getElementById('uniQty0')?.value || 1);
            }

            if(!codeVal.trim()) {
                alert("條碼內容不能為空！");
                return;
            }

            savedBarcodes.push({
                type: type,
                code: codeVal,
                qty: qty,
                note: '單筆紀錄',
                time: new Date().toLocaleString()
            });

            localStorage.setItem('seven_pos_saved', JSON.stringify(savedBarcodes));
            updateSavedCount();
            alert("已成功將此筆條碼儲存！");
        }

        function updateSavedCount() {
            document.getElementById('savedCountBadge').innerText = savedBarcodes.length;
        }

        function openSavedModal() {
            const container = document.getElementById('savedListContainer');
            container.innerHTML = '';

            if(savedBarcodes.length === 0) {
                container.innerHTML = '<div class="text-center text-xs text-slate-400 py-10">目前沒有已儲存的條碼</div>';
            } else {
                savedBarcodes.forEach((item, index) => {
                    let div = document.createElement('div');
                    div.className = "bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-2xs";
                    div.innerHTML = `
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] uppercase font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded">${item.type}</span>
                                ${item.note ? `<span class="text-[10px] font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-200">${item.note}</span>` : ''}
                                <span class="text-xs text-slate-400">${item.time}</span>
                            </div>
                            <div class="text-xs font-mono font-bold text-slate-800 mt-1.5">${item.code}</div>
                            <div class="text-[11px] text-emerald-600 mt-0.5 font-semibold">數量: ${item.qty}</div>
                        </div>
                        <button onclick="deleteSavedItem(${index})" class="text-slate-400 hover:text-rose-600 p-2 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    container.appendChild(div);
                });
            }
            document.getElementById('savedModal').classList.remove('hidden');
        }

        function closeSavedModal() {
            document.getElementById('savedModal').classList.add('hidden');
        }

        function deleteSavedItem(index) {
            savedBarcodes.splice(index, 1);
            localStorage.setItem('seven_pos_saved', JSON.stringify(savedBarcodes));
            updateSavedCount();
            openSavedModal();
        }

        function clearSavedBarcodes() {
            if(confirm("確定要清空所有已儲存的條碼嗎？")) {
                savedBarcodes = [];
                localStorage.removeItem('seven_pos_saved');
                updateSavedCount();
                openSavedModal();
            }
        }
    </script>
</body>
</html>
